name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - uses: oven-sh/setup-bun@v2

      - name: Install dev dependencies, for Markdown lint
        run: bun install --frozen-lockfile

      - name: Lint the Markdown, then test every schema, and that no version breaks an earlier one
        run: make lint validate

  replay-getting-started:
    name: replay-getting-started
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Replay every step of docs/getting-started.md
        run: make replay

  check-scenarios:
    name: check-scenarios
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Check that jsm refuses each scenario page's breaking edit
        run: make scenarios

  replay-deployed-versions:
    name: replay-deployed-versions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Replay every step of docs/deployed-versions.md
        run: make deployed
